services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: user
    volumes:
      - ./app:/app/app
    ports:
      - "8001:8000"
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      - user-db
    env_file:
      - .env

  user-db:
    image: postgres:17
    container_name: user-db
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@user-db:5432/user_db
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
      # - ./pgdata:/var/lib/postgresql/data

volumes:
  user-db-data:
    name: user-db-data
